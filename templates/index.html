<!DOCTYPE html>
<html lang="en">
<head>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700&display=swap" rel="stylesheet">
    <title>V60 GOD-PROTOCOL</title>
</head>
<body class="bg-black text-cyan-400 p-10 font-mono">
    <h1 style="font-family:'Orbitron'" class="text-4xl mb-10 border-b border-cyan-900 pb-5 text-white">V60 SUPREME COMMAND</h1>
    <div class="grid grid-cols-1 md:grid-cols-3 gap-6 mb-10">
        <div class="border border-cyan-500 p-6 rounded bg-zinc-900">
            <h3 class="text-xs text-gray-500">REVENUE (2% LOOP)</h3>
            <p class="text-3xl font-bold">{{ stats.sol }}</p>
        </div>
        <div class="border border-green-500 p-6 rounded bg-zinc-900">
            <h3 class="text-xs text-gray-500">BOOSTED VOLUME</h3>
            <p class="text-3xl font-bold text-green-400">{{ stats.volume }}</p>
        </div>
        <div class="border border-yellow-500 p-6 rounded bg-zinc-900">
            <h3 class="text-xs text-gray-500">TRENDING RANK</h3>
            <p class="text-3xl font-bold text-yellow-500">#{{ stats.rank }}</p>
        </div>
    </div>
    <div class="border border-cyan-900 p-8 rounded bg-black h-48 overflow-hidden">
        <h2 class="text-xl mb-4 text-cyan-600">📡 TACTICAL NEWSPAPER FEED</h2>
        <p class="text-sm opacity-60 animate-pulse">>> MONITORING WHALE MINT ROOTS | REVENUE FLOWING...</p>
    </div>
</body>
</html>
